<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ErrandLoop - Plan your stops. Get things done.</title>
<meta name="description" content="ErrandLoop is a personal errand planner. Organize errands by destination, priority, and due date, and plan outings that cover several stops in one trip. All data stays in your browser.">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
</head>
